# Canonical symbol map for ULES01213 (EU, DISC_VERSION 1.01). See docs/06-mhfu-module.md §5.
# Addresses only; no game code or data. Every entry was verified against the reference EU executable
# (SHA-1 04b60ee797bd628faa0525ebd52186fa05967963) on 2026-10-16.

[functions]
mh_main                 = 0x08906934 # module entry point

# Overlay manager (docs/04-recompiler.md §4.4). Groups: 0 eboot, 1 task, 2 sub, 3 em, 4 stage, 5 debug.
mh_overlay_request      = 0x08890144 # (System*, file_id, group): starts an async read of DATA.BIN file `file_id` into the group's region
mh_overlay_finish       = 0x088901F8 # (System*, file_id, group): completes the load, calls mh_overlay_prepare, records the active id
mh_overlay_is_active    = 0x08890284 # (System*, group, file_id) -> bool
mh_overlay_prepare      = 0x0890DD9C # (image*, size): cache maintenance, clears .bss after the image, runs its static initializers
mh_static_init_run      = 0x0890C2FC # (begin, end, ...): runs a static-initializer table (used for overlays and the executable)

# The camera (docs/06-mhfu-module.md section 9). Its projection is built from four fields, and rebuilt only when the field
# of view it last built with differs from the current one. Writing the aspect and breaking that comparison makes the game
# build the view again with the wider shape, so it draws more of the world instead of the picture being stretched.
mh_camera_setup         = 0x08815348 # (camera*): copies the fields into the projection builder and records the built fov

# The culling planes (docs/06-mhfu-module.md section 9). They are built from the camera's aspect and a depth factor of
# 1.5 times the far plane, which covers the view up to an aspect of about 3; a wider view leaves its corners outside and
# their objects are not drawn. Passing the factor's value in makes them cover it.
mh_cull_planes          = 0x08815E9C # (camera*): builds the frustum's planes from the camera

[data]
mh_overlay_region_bases = 0x089CBA70 # u32[6], region base address per group

[offsets]
system_active_overlays  = 0x00F7A580 # u16[6] inside System, active DATA.BIN file id per group (0xFFFF = none)

camera_near             = 0x00000000 # f32 inside the camera: near plane
camera_far              = 0x00000004 # f32: far plane
camera_aspect           = 0x00000008 # f32: width to height of the view, 480/272 by default
camera_fov              = 0x0000000C # f32: vertical field of view
camera_built_fov        = 0x00000010 # f32: the field of view the projection was last built with

cull_depth_slot         = 0x00000014 # f32, stack slot the culling's depth factor is read from (see the note in the docs)
